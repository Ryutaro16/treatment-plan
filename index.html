<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="治療計画">
<meta name="theme-color" content="#0f766e">
<title>治療計画</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
/* 歯式図（上顎・下顎）を中心に、下に1日ごとの治療の順番。狭い画面では歯式図を右側・左側の2枚に分ける */
:root{
  --bg:#f3f5f7; --card:#fff; --ink:#1f2933; --sub:#5f6b7a; --line:#d3d9e1; --soft:#eceff3;
  --accent:#0f766e; --accent-soft:#d6efec; --on-accent:#fff;
  --done:#16a34a; --done-soft:#dcf3e3; --doing:#2563eb; --doing-soft:#dbe7fd;
  --next:#b45309; --next-soft:#fdecd3; --ng:#b91c1c; --ng-soft:#fde8e8; --shade:rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14181d; --card:#1d232a; --ink:#e6eaef; --sub:#9aa5b1; --line:#36404b; --soft:#262d35;
    --accent:#2dd4bf; --accent-soft:#123b38; --on-accent:#0b1f1d;
    --done:#4ade80; --done-soft:#163222; --doing:#60a5fa; --doing-soft:#1b2c4a;
    --next:#fbbf24; --next-soft:#3d2f12; --ng:#fca5a5; --ng-soft:#3f1b1b; --shade:rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#14181d; --card:#1d232a; --ink:#e6eaef; --sub:#9aa5b1; --line:#36404b; --soft:#262d35;
  --accent:#2dd4bf; --accent-soft:#123b38; --on-accent:#0b1f1d;
  --done:#4ade80; --done-soft:#163222; --doing:#60a5fa; --doing-soft:#1b2c4a;
  --next:#fbbf24; --next-soft:#3d2f12; --ng:#fca5a5; --ng-soft:#3f1b1b; --shade:rgba(0,0,0,.55);
  color-scheme:dark;
}
/* touch-action:manipulation＝ダブルタップで拡大しない（2本指の拡大はできる）。2回タップで支台歯を選ぶときに画面が拡大しないように */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
[hidden]{display:none!important}
html,body{background:var(--bg);color:var(--ink)}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.6;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding-block:12px 80px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.top h1{font-size:1.2rem;margin:0}
.top h1 small,.pname small{font-size:.75rem;color:var(--sub);font-weight:400}
.top .sp{flex:1}
.pname{font-weight:700;font-size:1.15rem;min-width:0}
.pname .meta{font-size:.8rem;color:var(--sub);font-weight:400;margin-left:6px}
.btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-height:40px;font-size:.88rem;font-weight:600;white-space:nowrap}
.panel .btn{min-height:44px}
.pdel{margin:28px 0 0;text-align:right}
.panel{scroll-padding-top:64px;scroll-padding-bottom:84px} /* 固定した見出し・下のボタンの裏に、入力欄やボタンが隠れないように */
.btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.btn.danger{color:var(--ng);border-color:var(--ng)}
.btn.danger.fill{background:var(--ng);color:var(--card)}
.btn:disabled{opacity:.4}
.pv{font-size:.8rem;color:var(--sub);margin:0 0 12px}
.ph{color:var(--sub);font-weight:400}
/* 歯式の記号（5┘・6┐など） */
.pals{display:inline-flex;gap:3px;vertical-align:middle;align-items:center}
.pal{display:inline-flex;align-items:center;gap:2px;padding:0 4px 1px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.pal.q1{border-right:2px solid currentColor;border-bottom:2px solid currentColor}
.pal.q2{border-left:2px solid currentColor;border-bottom:2px solid currentColor}
.pal.q4{border-right:2px solid currentColor;border-top:2px solid currentColor}
.pal.q3{border-left:2px solid currentColor;border-top:2px solid currentColor}
/* 正中をまたぐときは1本の線でつなぎ、縦線は正中に1本だけ（②1|① の形） */
.pal.up{border-bottom:2px solid currentColor}
.pal.lo{border-top:2px solid currentColor}
.pal .pmid{align-self:stretch;border-left:2px solid currentColor;margin:0 2px}
.pal .ab{display:inline-grid;place-items:center;width:1.35em;height:1.35em;border:1.5px solid currentColor;border-radius:50%;font-size:.88em}
/* 患者一覧 */
.plist{display:grid;gap:10px}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:var(--next-soft);border:1px solid var(--next);border-radius:12px;padding:10px 12px;margin:0 0 12px;font-size:.9rem}
.search{display:flex;gap:6px;margin:0 0 10px}
.search input{flex:1;min-width:0;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.recent{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.recent .btn small{font-weight:400;color:var(--sub);font-size:.75rem}
.recent .btn{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.vp,.lnb .vp,.chain span,.pcard .pn,.pname,.vb{overflow-wrap:anywhere;min-width:0}
@media(min-width:700px){.plist{grid-template-columns:1fr 1fr}}
.pcard{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.pcard .pn{font-weight:700;font-size:1.05rem}
.pcard .pk{font-size:.8rem;color:var(--sub)}
.pcard .pp{display:flex;align-items:center;gap:8px;font-size:.82rem;color:var(--sub);margin-top:6px}
.pcard .px{font-size:.85rem;margin-top:4px}
.bar{flex:1;max-width:220px;height:6px;background:var(--soft);border-radius:99px;overflow:hidden;display:inline-block}
.bar i{display:block;height:100%;background:var(--done)}
/* 次回の帯 */
.nowbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;font-size:.88rem}
.nowbar .box{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px 10px;display:flex;align-items:center;gap:8px;max-width:100%;text-align:left;flex-wrap:wrap}
.nowbar button.box.nx{border:2px solid var(--next)}
.nowbar .k{color:var(--sub);font-size:.78rem;flex:0 0 auto}
/* 治療工程把握図 */
.figwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.fig.full{min-width:700px}
.fig+.fig{margin-top:14px;padding-top:10px;border-top:1px dashed var(--line)}
.ftitle{font-size:.75rem;color:var(--sub);font-weight:600;margin:0 0 2px}
.frow{display:grid;gap:0 3px}
.frow>*{grid-row:1}
.full .frow{grid-template-columns:38px repeat(8,minmax(0,1fr)) 4px repeat(8,minmax(0,1fr))}
.half.r .frow{grid-template-columns:30px repeat(8,minmax(0,1fr)) 4px}
.half.l .frow{grid-template-columns:30px 4px repeat(8,minmax(0,1fr))}
.brow{min-height:24px;align-items:end}
.brow.lo{align-items:start}
.lab{grid-column:1;color:var(--sub);font-size:.7rem;line-height:1.2;align-self:center}
.mid{background:var(--ink)}
.hr{height:2px;background:var(--ink);margin:3px 0}
.cell{display:flex;flex-direction:column;justify-content:flex-end;gap:3px;min-height:40px;padding:2px 0;min-width:0}
.cell.cd{justify-content:flex-start}
.num{border:none;background:none;font-weight:700;font-size:1.05rem;padding:4px 0;min-height:40px;border-radius:6px}
.num.miss{color:var(--sub);text-decoration:line-through}
.num:active{background:var(--soft)}
.stk{display:flex;flex-direction:column;align-items:center;text-align:center;line-height:1.2;font-size:.7rem;border-radius:8px;padding:3px 1px;border:1px solid transparent;background:none;min-width:0;overflow-wrap:anywhere}
.half .stk{font-size:.72rem}
@media(min-width:761px){.stk{font-size:.78rem}}
.stk .s,.stk .st{word-break:keep-all}
.cell .stk+.stk{margin-top:5px}
.stk.up{flex-direction:column-reverse}
.stk .ar{color:var(--sub);font-size:.68rem}
.stk .st{font-weight:700}
.stk .s{font-weight:600}
.stk .s.ok{color:var(--done)}
.stk .s.here{background:var(--doing);color:var(--card);border-radius:5px;padding:0 3px}
.stk.mt .st{color:var(--sub);font-weight:600}
.s-done{background:var(--done-soft)}
.s-done .st{color:var(--done)}
.s-doing{background:var(--doing-soft);border:2px solid var(--doing)}
.s-next{background:var(--next-soft);border:2px dashed var(--next)}
.m-want.s-todo{border:1px dashed var(--line)}
/* ◎・○（中は塗らない） */
.lgnote{}
.mk{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 4px;border-radius:99px;font-weight:700;font-size:.72rem;margin:3px 0;background:var(--card);color:var(--ink);border:1.5px solid currentColor}
.mk.must{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px currentColor}
.mk.done{color:var(--done)}
.mk.doing{color:var(--doing)}
.mk.next{color:var(--next)}
.brk{border:2px solid var(--ink);border-bottom:none;border-radius:7px 7px 0 0;font-weight:700;font-size:.72rem;text-align:center;background:none;padding:0 2px;margin:2px 0 0}
.brk .bmid{display:inline-block;width:2px;height:1.1em;background:currentColor;margin:0 3px;vertical-align:middle}
.brk .ab{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border:1.5px solid currentColor;border-radius:50%;margin:0 1px}
.brk.bd{border-bottom:2px solid var(--ink);border-top:none;border-radius:0 0 7px 7px;margin:0 0 2px}
.brk.ok{border-color:var(--done);color:var(--done)}
.brk.here{border-color:var(--doing);color:var(--doing);background:var(--doing-soft)}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.74rem;color:var(--sub);margin:8px 2px 0;align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-2px}
.legend .mk{min-width:18px;height:18px;font-size:.68rem;margin-right:6px}
/* 治療の順番（1日ごと） */
.order{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px 12px 8px}
.oh{display:flex;align-items:center;gap:6px 8px;padding:6px 0;flex-wrap:wrap}
.oh h2{font-size:.98rem;margin:0;white-space:nowrap}
.oh h2 small{font-weight:400;color:var(--sub);font-size:.75rem;margin-left:4px}
.oh .cnt{font-size:.8rem;color:var(--sub)}
.oh .sp{flex:1}
.vlist{position:relative}
.vrow{display:flex;gap:10px;align-items:center;padding:9px 6px;border-top:1px solid var(--soft);border-radius:10px;background:var(--card)}
.vrow.r-next{background:var(--next-soft)}
.vrow.r-done .vb{color:var(--sub)}
.vno{flex:0 0 auto;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--ink);font-weight:700;font-size:.85rem}
.vno.done{border-color:var(--done);color:var(--done)}
.vno.next{border-color:var(--next);color:var(--next);border-width:2px}
.vb{flex:1;min-width:0;min-height:40px;justify-content:center;text-align:left;background:none;border:none;padding:0;display:flex;flex-direction:column;gap:4px}
.vl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px}
.vp{font-weight:600}
.vmemo{font-size:.78rem;color:var(--sub)}
.chk{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:5px 14px;min-height:40px;font-size:.8rem;font-weight:700;white-space:nowrap}
.chk.on{background:var(--done-soft);color:var(--done);border-color:var(--done)}
.r-next .chk{border-color:var(--next);color:var(--next)}
.grip{flex:0 0 auto;color:var(--sub);font-size:1.3rem;display:grid;place-items:center;width:44px;height:44px;margin:-8px -4px -8px 0;border-radius:10px;touch-action:none;cursor:grab}
.grip:active{background:var(--soft)}
.decide .vrow{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.vrow.lift{position:relative;z-index:5;box-shadow:0 10px 26px var(--shade);outline:2px solid var(--accent);background:var(--card);cursor:grabbing}
.vno.und{width:auto;padding:0 7px;border-radius:14px;border-style:dashed;color:var(--sub);font-size:.75rem;font-weight:600}
.vno.pick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.decide .vrow.fx{opacity:.6}
.decide .vrow:not(.fx):not(.kp){cursor:pointer}
.decide .vrow:not(.fx):not(.kp) .vb{outline:1px dashed var(--accent);outline-offset:2px;border-radius:8px}
.dbar{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px;position:sticky;top:0;z-index:4;background:var(--card);padding:6px 0}
.rhint{font-size:.8rem;color:var(--accent);font-weight:600;margin:2px 0 6px}
.empty{color:var(--sub);text-align:center;padding:24px 8px;font-size:.9rem}
/* 下からのパネル */
#sheet{position:fixed;inset:0;background:var(--shade);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.panel{background:var(--card);width:100%;max-width:760px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px))}
.panel h3{margin:0 0 6px;font-size:1.1rem;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3{padding-right:52px}
/* 見出しを上に固定（× が中身のボタンに重ならないように） */
.panel h3{position:sticky;top:-14px;z-index:2;background:var(--card);padding:6px 52px 8px 0;margin:-6px 0 6px}
/* 下のボタン（追加・直すなど）は、いつも見える所に */
.panel .foot{position:sticky;bottom:-16px;z-index:2;background:var(--card);padding:8px 0 10px;margin-bottom:-6px;border-top:1px solid var(--soft)}
#sheet:not([hidden]) ~ #toast{bottom:auto;top:calc(12px + env(safe-area-inset-top, 0px))}
@media(max-width:760px){.top .pname{order:-1;flex-basis:100%}}
.xbar{position:sticky;top:0;height:0;display:flex;justify-content:flex-end;z-index:3}
.xbtn{width:44px;height:44px;margin-top:-4px;border-radius:50%;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:1.5rem;line-height:1;display:grid;place-items:center;padding:0}
.panel h3 small{font-weight:400;color:var(--sub);font-size:.85rem}
.lbl{font-size:.8rem;color:var(--sub);margin:12px 0 4px;font-weight:600}
.grid-btns{display:flex;flex-wrap:wrap;gap:6px}
.grid-btns .btn{font-weight:500}
.grid-btns .btn.addopt{border-style:dashed;color:var(--accent);font-weight:700}
.optbox{margin-top:8px;padding:10px;border:1px dashed var(--accent);border-radius:12px}
.optbox .grid-btns{margin-top:8px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.chain{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:34px;background:var(--soft);border-radius:10px;padding:5px 8px;font-weight:600}
.chain .ph{font-size:.85rem}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{font-size:.8rem;padding:4px 10px;border-radius:8px;background:var(--soft);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--done-soft);color:var(--done);border-color:var(--done);font-weight:600}
.chip.here{background:var(--doing);color:var(--card);border-color:var(--doing);font-weight:700}
.car{color:var(--sub);font-size:.7rem}
.free{display:flex;gap:6px;margin-top:6px}
.free input{flex:1;min-width:0}
input[type=text],textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;width:100%}
textarea{min-height:60px}
.foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
.foot .left{margin-right:auto}
.warn{font-size:.8rem;color:var(--next);margin-top:8px}
.lines{display:grid;gap:6px}
.lnrow{display:flex;gap:6px;align-items:stretch}
.lnb{flex:1;min-width:0;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.lnrow.cur .lnb{border:2px solid var(--accent);background:var(--accent-soft)}
.mini{display:flex;flex-direction:column;gap:3px;max-width:100%}
.mblock{display:flex;flex-direction:column;gap:3px}
.mblock+.mblock{margin-top:6px}
.mlab{font-size:.75rem;color:var(--sub)}
.mrow{display:flex;gap:3px;align-items:stretch}
.mrow.lower{padding-top:3px;border-top:2px solid var(--line)}
.mrow .mt{flex:1 1 0;min-width:0;max-width:44px;height:42px;border:1px solid var(--line);border-radius:7px;background:var(--card);font-weight:700;font-size:.85rem;padding:0}
.mrow .mt .ab{display:inline-grid;place-items:center;width:1.6em;height:1.6em;border:2px solid currentColor;border-radius:50%}
.mrow .mt.miss{color:var(--sub);text-decoration:line-through}
.mrow .mt.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.mrow .mmid{width:2px;flex:0 0 2px;background:var(--ink);margin:0 3px}
.field{display:block;margin-top:8px}
.field span{display:block;font-size:.8rem;color:var(--sub)}
.list-in-sheet{display:grid;gap:6px}
.list-in-sheet .btn{text-align:left;white-space:normal;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-weight:500}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--card);border-radius:12px;padding:9px 14px;font-size:.88rem;display:flex;gap:12px;align-items:center;z-index:20;width:max-content;max-width:calc(100% - 32px)}
#toast button{background:none;border:none;color:var(--card);font-weight:700;text-decoration:underline;padding:0;white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}}
/* 印刷：カルテに入れる用。ボタン類は出さず、図は1枚（右上〜左上を横一列）、背景は白 */
#print{display:none}
@media print{
  :root,:root:not([data-theme="light"]),:root[data-theme="dark"]{
    --bg:#fff; --card:#fff; --ink:#111; --sub:#555; --line:#bbb; --soft:#eee;
    --accent:#0f766e; --accent-soft:#d6efec; --on-accent:#fff;
    --done:#15803d; --done-soft:#e3f5e8; --doing:#1d4ed8; --doing-soft:#e0e9fd;
    --next:#b45309; --next-soft:#fdf0dc; color-scheme:light;
  }
  @page{size:A4 portrait;margin:10mm}
  html,body{background:#fff}
  body{font-size:12px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #app,#sheet,#toast{display:none!important}
  #print{display:block}
  .phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;border-bottom:2px solid #111;padding-bottom:4px;margin-bottom:8px}
  .phead h1{font-size:16px;margin:0}
  .phead .pt{font-size:11px;color:#555}
  .phead .sp{flex:1}
  /* 紙の幅に合わせて縮める（画面用の最小幅・横スクロールを外す。iPad の Safari で右端が切れていた） */
  #print .figwrap{border:1px solid #bbb;break-inside:avoid;overflow:visible;padding:8px 4px}
  #print .fig.full{min-width:0}
  #print .full .frow{grid-template-columns:30px repeat(8,minmax(0,1fr)) 4px repeat(8,minmax(0,1fr))}
  #print .stk,#print .brk{font-size:10px}

// ---- 印刷（カルテに入れる用）：今の患者の図と治療の順番を A4 1枚に ----
function printHTML() {
  const p = db.patients.find((x) => x.id === view.pid), pl = curPlan(), a = analyze(pl), d = today();
  const rows = pl.visits.map((v) => `<tr><td class="c-no">${vnoHTML(pl, a, v)}</td><td>${linesHTML(v)}${v.memo ? `<div class="vmemo">${esc(v.memo)}</div>` : ''}</td><td class="c-dt">${v.done ? `✓ ${md(v.done)}` : ''}</td></tr>`).join('');
  return `<div class="phead"><h1>治療計画　${esc(p.name)} 様</h1><span>${p.chartNo ? `No.${esc(p.chartNo)}　` : ''}計画 第${pl.version}版　完了 ${a.done} ／ ${a.total} 日${a.nextV ? `　次回 ${circ(pl.visits.indexOf(a.nextV) + 1)}` : ''}</span>
      <span class="sp"></span><span class="pt">印刷 ${d.replace(/-/g, '/')}</span></div>
    <div class="figwrap">${figure(pl, a, LAYOUTS.full)}${$('.legend') ? $('.legend').outerHTML : ''}</div>
    <h2>治療の順番</h2>
    ${rows ? `<table class="ptab"><thead><tr><th colspan="3">${esc(p.name)} 様${p.chartNo ? `　No.${esc(p.chartNo)}` : ''}　治療の順番</th></tr></thead><tbody>${rows}</tbody></table>` : '<p>まだありません</p>'}`;
}
function figure(pl, a, L) {
  return `<div class="fig ${L.cls}">${L.title ? `<p class="ftitle">${L.title}</p>` : ''}
    ${bracketRow(pl, a, L, true)}
    ${stackRow(pl, a, L, true)}
    ${numRow(pl, L, L.up, '上顎')}
    <div class="hr"></div>
    ${numRow(pl, L, L.lo, '下顎')}
    ${stackRow(pl, a, L, false)}
    ${bracketRow(pl, a, L, false)}
  </div>`;
}
function numRow(pl, L, teeth, label) {
  return `<div class="frow"><div class="lab">${label}</div><div class="mid" style="grid-column:${L.mid}"></div>${teeth.map((t) =>
    `<button class="num${pl.missing.includes(t) ? ' miss' : ''}" style="grid-column:${L.col(t)}" data-act="tooth" data-t="${t}">${t % 10}</button>`).join('')}</div>`;
}
// 1つの治療の「印 → 状態 → 治療…」は、見えている歯のうち真ん中の歯にまとめて描く
function anchorOf(it, shown) {
  const s = it.teeth.filter((t) => shown.includes(t)).sort(byCol);
  return s.length ? s[Math.floor((s.length - 1) / 2)] : null;
}
function stackRow(pl, a, L, upper) {
  const teeth = upper ? L.up : L.lo, ar = upper ? '↑' : '↓';
  let h = `<div class="frow"><div class="lab">状態<br>${ar}<br>治療</div><div class="mid" style="grid-column:${L.mid}"></div>`;
  for (const t of teeth) {
    const its = pl.items.filter((i) => i.teeth.includes(t));
    let inner = '';
    for (const it of its) {
      const cls = `stk ${upper ? 'up' : 'dn'} s-${a.ist[it.id]} m-${it.mark || 'none'}`;
      // iPhone で右側・左側に分かれるとき、正中をまたぐ治療は歯の多い側（同じなら右側）にだけ全部を描く
      const sh = it.teeth.filter((x) => teeth.includes(x)), rest = it.teeth.length - sh.length;
      const major = !rest || sh.length > rest || (sh.length === rest && [1, 4].includes(quad(sh[0])));
      const stHTML = it.state ? `<span class="st">${splitStates(it.state).map(esc).join(',<br>')}</span>` : '';
      if (!major || anchorOf(it, teeth) !== t) { if (it.state) inner += `<button class="${cls}" data-act="item" data-id="${it.id}">${stHTML}</button>`; continue; }
      const parts = [markHTML(it, a)];
      if (it.state) parts.push(stHTML);
      it.steps.forEach((x, j) => {
        if (BRACKET.has(x.name) && it.span && it.span.length) return; // 括弧の行に描く
        const ok = a.sdone[it.id][j];
        parts.push(`<span class="ar">${ar}</span>`, `<span class="s${ok ? ' ok' : ''}${j === a.here[it.id] ? ' here' : ''}">${esc(x.name)}${ok ? ' ✓' : ''}</span>`);
      });
      inner += `<button class="${cls}" data-act="item" data-id="${it.id}">${parts.join('')}</button>`;
    }
    if (!its.length && pl.missing.includes(t)) inner = `<button class="stk ${upper ? 'up' : 'dn'} mt" data-act="tooth" data-t="${t}"><span class="st">MT</span></button>`;
    h += `<div class="cell ${upper ? 'cu' : 'cd'}" style="grid-column:${L.col(t)}">${inner}</div>`;
  }
  return h + '</div>';
}
function bracketRow(pl, a, L, upper) {
  const teeth = upper ? L.up : L.lo;
  let h = `<div class="frow brow${upper ? '' : ' lo'}"><div class="lab"></div>`;
  const lanes = []; // 重なる括弧は段を分ける（lanes[段] = 使っている列の範囲）
  for (const it of pl.items) {
    it.steps.forEach((x, j) => {
      if (!BRACKET.has(x.name) || !it.span || !it.span.length) return;
      const shown = it.span.filter((t) => teeth.includes(t)), cs = shown.map(L.col);
      if (!cs.length) return;
      // 括弧の中は、図の並び順の歯番号（支台歯は丸）だけ。歯式の線は付けない（括弧の位置で歯は分かる）
      // iPhone で右側・左側に分かれるときは、歯の多い側（同じなら右側）にだけ番号を出し、もう片方は「Br」だけ
      const rest = it.span.length - shown.length;
      const full = shown.length > rest || (shown.length === rest && [1, 4].includes(quad(shown[0])));
      const ab = brAbut(it);
      const srt = [...it.span].sort(byCol), isR = (t) => [1, 4].includes(quad(t));
      const lab = x.name === 'Br' && full ? `${srt.map((t, i) => (i && isR(srt[i - 1]) && !isR(t) ? '<span class="bmid"></span>' : '') + (ab.includes(t) ? `<span class="ab">${t % 10}</span>` : t % 10)).join('')} ` : '';
      const c0 = Math.min(...cs), c1 = Math.max(...cs);
      let lane = lanes.findIndex((u) => u.every(([a0, a1]) => c1 < a0 || c0 > a1));
      if (lane < 0) { lanes.push([]); lane = lanes.length - 1; }
      lanes[lane].push([c0, c1]);
      const ok = a.sdone[it.id][j];
      h += `<button class="brk ${upper ? 'bu' : 'bd'}${ok ? ' ok' : ''}${j === a.here[it.id] ? ' here' : ''}" style="grid-column:${c0}/${c1 + 1};grid-row:LANE${lane}" data-act="item" data-id="${it.id}">${lab}${esc(x.name)}${ok ? ' ✓' : ''}</button>`;
    });
  }
  // 上顎は歯から遠い段ほど上、下顎は下へ
  h = h.replace(/LANE(\d+)/g, (_, n) => (upper ? lanes.length - +n : +n + 1));
  return h + '</div>';
}

function orderList(pl, a) {
  const d = view.decide;
  // 決める途中：決まっている日（全部決め直すときは完了した日だけ）は動かさず、ほかの日を押した順に番号を付ける
  const keep = (v) => (d && d.all ? !!v.done : isFixed(v));
  const base = pl.visits.filter(keep).length;
  const rows = pl.visits.map((v, i) => {
    const k = a.vst[v.id];
    let no = vnoHTML(pl, a, v), act = 'visit', fx = '';
    if (d) {
      const pi = d.picked.indexOf(v.id);
      if (keep(v)) fx = v.done ? ' fx' : ' kp';
      else { act = 'dpick'; no = pi >= 0 ? `<span class="vno pick">${base + pi + 1}</span>` : '<span class="vno und">未定</span>'; }
    }
    const right = d ? (v.done ? `<span class="ph" style="font-size:.8rem">✓ ${md(v.done)}</span>` : '<span class="grip" aria-hidden="true">≡</span>') : `<button class="chk${v.done ? ' on' : ''}" data-act="vdone" data-id="${v.id}">${v.done ? `✓ ${md(v.done)}` : '完了'}</button>`;
    // 決める途中は、行のどこ（「未定」の丸を含む）を押しても番号が付く
    return `<div class="vrow r-${k}${fx}" data-id="${v.id}"${d && !keep(v) ? ' data-act="dpick"' : ''}>
      ${no}
      <button class="vb" data-act="${fx || (d && keep(v)) ? 'none' : act}" data-id="${v.id}">${linesHTML(v)}${v.memo ? `<span class="vmemo">${esc(v.memo)}</span>` : ''}</button>
      ${right}</div>`;
  }).join('');
  const undec = pl.visits.filter((v) => !isFixed(v)).length, open = pl.visits.some((v) => !v.done);
  const head = d ? ''
    : `${open ? `<button class="btn${undec ? ' main' : ''}" data-act="decide">順番を決める${undec ? `（未定 ${undec}）` : ''}</button>` : ''}
      <button class="btn${undec ? '' : ' main'}" data-act="vadd">＋ 追加</button>`;
  const dbar = d ? `<p class="rhint">${d.all ? '完了していない日を治療する順に押す（押さなかった日は未定に戻ります）' : '未定の日を治療する順に押す（もう一度で外す）'}。≡ をつかむと並べ替え（その場で保存）</p>
    <div class="dbar"><button class="btn" data-act="dpop" ${d.picked.length ? '' : 'disabled'}>1つ戻す</button><button class="btn" data-act="dclear" ${d.picked.length ? '' : 'disabled'}>最初から</button>
      <button class="btn${d.all ? ' on' : ''}" data-act="dall">${d.all ? '決まっている日はそのまま' : '全部決め直す'}</button><span class="sp" style="flex:1"></span>
      <button class="btn" data-act="dcancel">${d.picked.length ? 'やめる' : '終わる'}</button><button class="btn main" data-act="dok" ${d.picked.length ? '' : 'disabled'}>決定</button></div>` : '';
  return `<section class="order${d ? ' decide' : ''}">
    <div class="oh"><h2>治療の順番<small>1日ごと</small></h2><span class="cnt">完了 ${a.done} ／ ${a.total} 日</span><span class="sp"></span>${head}</div>
    ${dbar}
    <div class="vlist">${rows || '<p class="empty">まだありません。図に追加するか「＋ 追加」で1日分ずつ入れてください</p>'}</div>
    ${d ? '' : '<p class="pv" style="margin:8px 0 0">「完了」を押すと、その日の処置が図にも✓で反映されます（日付は今日）。</p>'}
  </section>`;
}

function miniGrid(sel, act, missing = [], circled = []) {
  const btn = (t) => `<button class="mt${sel.includes(t) ? ' on' : ''}${missing.includes(t) ? ' miss' : ''}" data-act="${act}" data-t="${t}" aria-label="${toothName(t)}">${circled.includes(t) ? `<span class="ab">${t % 10}</span>` : t % 10}</button>`;
  const mid = '<span class="mmid"></span>';
  if (NARROW.matches) { // iPhone：右側・左側に分ける
    const blk = (title, up, lo, midFirst) => `<div class="mblock"><div class="mlab">${title}</div>
      <div class="mrow">${midFirst ? mid : ''}${up.map(btn).join('')}${midFirst ? '' : mid}</div>
      <div class="mrow lower">${midFirst ? mid : ''}${lo.map(btn).join('')}${midFirst ? '' : mid}</div></div>`;
    return `<div class="mini">${blk('右側', UPPER.slice(0, 8), LOWER.slice(0, 8), false)}${blk('左側', UPPER.slice(8), LOWER.slice(8), true)}</div>`;
  }
  const row = (ts, cls) => `<div class="mrow ${cls}">${ts.slice(0, 8).map(btn).join('')}${mid}${ts.slice(8).map(btn).join('')}</div>`;
  return `<div class="mini">${row(UPPER, '')}${row(LOWER, 'lower')}</div>`;
}

// iPad は共有シート（ファイルに保存・AirDrop など）、パソコンはダウンロード
async function saveFile(file, title) {
  if (navigator.maxTouchPoints > 0 && navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title }); return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file); a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
async function exportBackup() {

  const data = { app: 'treatment-plan', version: 1, exportedAt: d.toISOString(), patients: db.patients, plans: db.plans, custom: db.custom };
  try { await saveFile(new File([JSON.stringify(data)], name, { type: 'application/json' }), '治療計画のバックアップ'); }
  catch (err) { if (err && err.name === 'AbortError') return; toast('バックアップを書き出せませんでした：' + err); return; } // AbortError＝共有画面を閉じた
  db.lastBackupAt = Date.now(); save(); toast('バックアップを書き出しました'); render();
}
async function importBackup(file) {
  let data;

  if (!data || data.app !== 'treatment-plan' || !Array.isArray(data.patients) || !data.plans) { toast('このアプリのバックアップファイルではありません'); return; }
  sheet = { type: 'confirm', title: 'バックアップから読み込む', msg: `患者 ${data.patients.length}人分を読み込みます（${data.exportedAt ? new Date(data.exportedAt).toLocaleString('ja-JP') : '日時不明'} の書き出し）。今あるデータは消えず、同じ患者は更新が新しいほうが残ります。`, ok: '読み込む', back: { type: 'backup' },
    run: () => {
      let add = 0, upd = 0;
      for (const p of data.patients) {

        const cur = db.patients.find((x) => x.id === p.id);

        else if ((pl.updatedAt || 0) > (db.plans[p.id].updatedAt || 0)) { Object.assign(cur, p); db.plans[p.id] = pl; upd++; }
      }
      for (const k of ['procs', 'steps']) for (const x of ((data.custom || {})[k] || [])) if (!db.custom[k].includes(x)) db.custom[k].push(x);

function dragStart(row, y, now = false) {

    if (!drag) return;

    Object.assign(drag, { active: true, list: row.parentElement, grab: drag.startY - r.top });
    row.classList.add('lift');
    try { if (navigator.vibrate) navigator.vibrate(10); } catch (e) { /* 振動できない端末 */ }

function dragEnd() {

      return renderSheet();
    }
    case 'vadd': sheet = { type: 'vwiz', editId: null, cur: 0, lines: [{ teeth: [], procs: [], abut: [] }] }; return renderSheet();
    case 'vedit': { const vv = findVisit(sheet.id); sheet = { type: 'vwiz', editId: vv.id, cur: 0, lines: vv.lines.map((x) => ({ teeth: [...x.teeth], procs: [...x.procs], abut: [...(x.abut || [])] })) }; return renderSheet(); }
    case 'vlsel': sheet.cur = +el.dataset.i; return renderSheet();
    case 'vladd': sheet.lines.push({ teeth: [], procs: [], abut: [] }); sheet.cur = sheet.lines.length - 1; return renderSheet();
    case 'vldel': { const i = +el.dataset.i; sheet.lines.splice(i, 1); if (i < sheet.cur) sheet.cur--; sheet.cur = Math.min(sheet.cur, sheet.lines.length - 1); return renderSheet(); }
    case 'vt': { // 選ぶ → 丸（支台歯） → 外す の順に切り替わる
      const ln = sheet.lines[sheet.cur];
      if (!ln.teeth.includes(t)) ln.teeth.push(t);
      else if (!ln.abut.includes(t)) ln.abut.push(t);
      else { ln.teeth = ln.teeth.filter((x) => x !== t); ln.abut = ln.abut.filter((x) => x !== t); }
      return renderSheet();
    }
    case 'vp': case 'vpfree': {
      const ln = sheet.lines[sheet.cur], xs = a === 'vp' ? [v] : splitStates($('#fv').value).map((y) => canon(y, optList('procs'))); if (!xs.length) return;
      if (a === 'vpfree') $('#fv').value = '';
      for (const x of xs) { ln.procs.push(x); if (/^br/i.test(x) && !ln.abut.length) ln.abut = ends(ln.teeth); } // Br は両端を支台歯の初期値に
      return renderSheet();
    }
    case 'vppop': sheet.lines[sheet.cur].procs.pop(); return renderSheet();
    case 'vpclear': sheet.lines[sheet.cur].procs = []; return renderSheet();
    case 'optnew': sheet.optEdit = el.dataset.k; renderSheet(); { const f = $('#fo'); if (f) f.focus(); } return;
    case 'optclose': sheet.optEdit = null; return renderSheet();
    case 'optadd': {
      const k = el.dataset.k, x = $('#fo').value.trim(); if (!x) return;
      if (optList(k).some((y) => norm(y) === norm(x))) { toast(`「${x}」はもうあります`); return; }
      db.custom[k].push(x); save(); sheet.optEdit = null; toast(`「${x}」のボタンを作りました。次からも使えます`); return renderSheet();
    }
    case 'optdel': db.custom[el.dataset.k].splice(+el.dataset.i, 1); save(); return renderSheet();
    case 'vsave': {
      // Br で支台歯の丸が無いときは、両端を支台歯にする
      const w = sheet, lines = w.lines.map((x) => { const ab = x.abut.filter((t) => x.teeth.includes(t)); return { teeth: [...x.teeth].sort(byCol), procs: x.procs, abut: (ab.length || !x.procs.some((q) => /^br/i.test(q.trim())) ? ab : ends(x.teeth)).sort(byCol) }; });
      const fig = (n) => (n ? '。図にも追加しました' : '');
      if (w.editId) { const vv = findVisit(w.editId); vv.lines = lines; const n = visitToItems(pl, vv); sheet = { type: 'visit', id: w.editId }; toast('直しました' + fig(n)); }
      else { const vv = { id: uid(), done: null, fixed: false, memo: '', lines }; pl.visits.push(vv); const n = visitToItems(pl, vv); sheet = null; toast(`一番下に「未定」で追加しました${fig(n)}。「順番を決める」で番号を付けます`); }
      return commit();
    }
    // 図の治療
    case 'mark': findItem(sheet.id).mark = v; return commit();
    case 'itemOrder': { const ns = itemToVisits(pl, findItem(sheet.id)); toast(ns.length ? `治療の順番の一番下に「未定」で入れました（${ns.length}日分）` : 'もう治療の順番に入っています'); return commit(); }
    case 'del': {
      const it = findItem(sheet.id), i = pl.items.indexOf(it);
      sheet = { type: 'confirm', title: '図から削除', msg: `${teethName(it.teeth)}（${[it.state, ...it.steps.map((x) => x.name)].filter(Boolean).join(' → ')}）を図から削除します。治療の順番はそのまま残ります。`, ok: '削除する', back: sheet,
        run: () => { pl.items.splice(i, 1); toast('削除しました', () => { pl.items.splice(i, 0, it); }); } };
      return renderSheet();
    }
    case 'missing': { const i = pl.missing.indexOf(sheet.t); if (i >= 0) pl.missing.splice(i, 1); else pl.missing.push(sheet.t); return commit(); }
    case 'add': sheet = { type: 'wiz', editId: null, teeth: [], states: [], steps: [], span: [], abut: [], mark: '' }; return renderSheet();
    case 'addTooth': sheet = { type: 'wiz', editId: null, teeth: [sheet.t], states: pl.missing.includes(sheet.t) ? ['MT'] : [], steps: [], span: [], abut: [], mark: '' }; return renderSheet();
    case 'edit': {
      const it = findItem(sheet.id);
      const eab = it.steps.some((x) => x.name === 'Br') || Array.isArray(it.abut) ? brAbut(it) : []; // 支台歯も①に選んだ状態で開く
      sheet = { type: 'wiz', editId: it.id, teeth: [...new Set([...it.teeth, ...eab])].sort(byCol), states: splitStates(it.state), steps: it.steps.map((x) => x.name), span: [...(it.span || [])], abut: [...eab], mark: it.mark };
      return renderSheet();
    }
    case 'wt': { // 選ぶ → 丸（支台歯） → 外す。ブリッジの範囲（④）にも同じ歯を合わせる
      const w = sheet, br = w.steps.includes('Br');
      if (!w.teeth.includes(t)) { w.teeth.push(t); if (br && !w.span.includes(t)) w.span.push(t); }
      else if (!w.abut.includes(t)) { w.abut.push(t); if (br && !w.span.includes(t)) w.span.push(t); }
      else { w.teeth = w.teeth.filter((x) => x !== t); w.abut = w.abut.filter((x) => x !== t); if (br) w.span = w.span.filter((x) => x !== t); }
      return renderSheet();
    }
    case 'wspall': { // 義歯：上顎（下顎）を全部入れる。全部入っていれば外す
      const jaw = v === 'up' ? UPPER : LOWER, all = jaw.every((x) => sheet.span.includes(x));
      sheet.span = all ? sheet.span.filter((x) => !jaw.includes(x)) : [...new Set([...sheet.span, ...jaw])];
      return renderSheet();
    }
    case 'wsp': { // ブリッジは 範囲 → 丸（支台歯） → 外す の順に切り替わる。義歯は範囲のオン・オフだけ
      const w = sheet, inSpan = w.span.includes(t), isAb = w.abut.includes(t);
      if (!inSpan) w.span.push(t);
      else if (w.steps.includes('Br') && !isAb) w.abut.push(t);
      else { w.span = w.span.filter((x) => x !== t); w.abut = w.abut.filter((x) => x !== t); }
      return renderSheet();
    }
    case 'ws': { const s = sheet.states, i = s.indexOf(v); if (i >= 0) s.splice(i, 1); else s.push(v); return renderSheet(); }
    case 'wsfree': { for (const x of splitStates($('#fs').value).map((y) => canon(y, STATES))) if (!sheet.states.some((y) => norm(y) === norm(x))) sheet.states.push(x); $('#fs').value = ''; return renderSheet(); }
    case 'wspop': sheet.states.pop(); return renderSheet();
    case 'wsclear': sheet.states = []; return renderSheet();
    case 'wa': case 'wafree': {
      const xs = a === 'wa' ? [v] : splitStates($('#fa').value).map((y) => canon(y, optList('steps'))); if (!xs.length) return;
      if (a === 'wafree') $('#fa').value = '';
      for (const x of xs) { sheet.steps.push(x); if (BRACKET.has(x) && !sheet.span.length) sheet.span = [...sheet.teeth]; }
      return renderSheet();
    }
    case 'wpop': sheet.steps.pop(); return renderSheet();
    case 'wclear': sheet.steps = []; return renderSheet();
    case 'wm': sheet.mark = v; return renderSheet();
    case 'wsave': {
      const w = sheet, needSpan = w.steps.some((x) => BRACKET.has(x)), state = w.states.join(STATE_SEP);
      const span = needSpan ? [...w.span].sort(byCol) : null, steps = w.steps.map((name) => ({ name }));
      // 支台歯：ブリッジなら範囲の中の丸。ブリッジ以外でも①で丸を付けた歯は残す
      const ab = w.abut.filter((x) => w.teeth.includes(x) || (span || []).includes(x)).sort(byCol);
      const abut = needSpan && w.steps.includes('Br') ? ab.filter((x) => span.includes(x)) : ab.length ? ab : null;
      if (w.editId) {
        const it = Object.assign(findItem(w.editId), { teeth: [...w.teeth].sort(byCol), state, steps, span, abut, mark: w.mark });
        const ns = itemToVisits(pl, it);
        sheet = { type: 'item', id: w.editId }; toast(ns.length ? '直しました。足した治療は治療の順番の一番下に「未定」で入れました' : '直しました');
      } else {
        const it = { id: uid(), mark: w.mark, teeth: [...w.teeth].sort(byCol), state, steps, span, abut, memo: '' };
        pl.items.push(it);
        const ns = itemToVisits(pl, it);
        sheet = null; toast(ns.length ? `図に追加し、治療の順番の一番下に「未定」で入れました${ns.length > 1 ? `（${ns.length}日分。1日にまとめるときは日を直してください）` : ''}` : '図に追加しました');
      }
      return commit();
    }
  }
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'pq') { view.q = e.target.value; $('#plbody').innerHTML = listBody(); $('#qx').hidden = !view.q; return; } // 入力欄は描き直さない（打っている途中で消えないように）
  if (!sheet) return;
  if (e.target.dataset.input === 'memo' && sheet.type === 'item') { findItem(sheet.id).memo = e.target.value; save(); }
  if (e.target.dataset.input === 'vmemo' && sheet.type === 'visit') { findVisit(sheet.id).memo = e.target.value; save(); }
});
// 自由入力欄で Enter を押したら、横の「足す」などと同じ
const ENTER_ACT = { fs: 'wsfree', fa: 'wafree', fv: 'vpfree', fo: 'optadd', pn: 'psave', pc: 'psave' };
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.isComposing && ENTER_ACT[e.target.id]) { e.preventDefault(); const b = $(`#panel [data-act="${ENTER_ACT[e.target.id]}"]`); if (b) b.click(); }
});
document.addEventListener('keydown', (e) => {
  if (e.target.id !== 'pq' || e.key !== 'Enter' || e.isComposing) return;
  const hits = db.patients.filter((p) => matchQ(p, normQ(view.q)));
  if (hits.length === 1) { e.preventDefault(); view.pid = hits[0].id; view.decide = null; touchRecent(view.pid); window.scrollTo(0, 0); render(); }
});
document.addEventListener('change', (e) => { if (e.target.id === 'imp' && e.target.files[0]) importBackup(e.target.files[0]); });
document.addEventListener('change', (e) => { if (e.target.dataset.input && view.pid) renderPatient(); });

render();
</script>
